name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: go tool golangci-lint run ./...
      - name: go test
        run: go test -count=1 ./...
      - name: go build
        run: go build ./...
      - name: OpenAPI is current
        run: make openapi-check
