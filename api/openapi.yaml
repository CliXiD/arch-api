openapi: 3.1.0
info:
  title: Architecture E2E API
  version: 0.1.0
paths:
  /api/v1/edges:
    get:
      operationId: list-edges
      parameters:
      - description: Only edges of this environment; unknown gives 422.
        explode: false
        in: query
        name: environment
        schema:
          description: Only edges of this environment; unknown gives 422.
          type: string
      - description: Only edges of this edge type.
        explode: false
        in: query
        name: type
        schema:
          description: Only edges of this edge type.
          type: string
      - description: Only edges from this node id.
        explode: false
        in: query
        name: from
        schema:
          description: Only edges from this node id.
          type: string
      - description: Only edges to this node id.
        explode: false
        in: query
        name: to
        schema:
          description: Only edges to this node id.
          type: string
      - description: Page size.
        explode: false
        in: query
        name: limit
        schema:
          default: 100
          description: Page size.
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - description: Opaque cursor from a previous page's next_cursor.
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque cursor from a previous page's next_cursor.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgePage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: A page of edges
      tags:
      - model
    post:
      operationId: create-edge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgeCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Edge"
          description: Created
          headers:
            ETag:
              schema:
                description: The edge's version, quoted.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: Create an edge (editor of the source node's team, or admin)
      tags:
      - model
  /api/v1/edges/{uid}:
    delete:
      operationId: delete-edge
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          format: uuid
          type: string
      - description: "The current version, quoted, as in the ETag. Required: 428 without it, 412 when it is not the current version."
        in: header
        name: If-Match
        schema:
          description: "The current version, quoted, as in the ETag. Required: 428 without it, 412 when it is not the current version."
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Precondition Failed
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Precondition Required
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: Delete an edge
      tags:
      - model
    patch:
      operationId: update-edge
      parameters:
      - in: path
        name: uid
        required: true
        schema:
          format: uuid
          type: string
      - description: "The current version, quoted, as in the ETag. Required: 428 without it, 412 when it is not the current version."
        in: header
        name: If-Match
        schema:
          description: "The current version, quoted, as in the ETag. Required: 428 without it, 412 when it is not the current version."
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EdgePatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Edge"
          description: OK
          headers:
            ETag:
              schema:
                description: The edge's version, quoted.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Precondition Failed
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Precondition Required
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: Replace an edge's attributes
      tags:
      - model
  /api/v1/environments:
