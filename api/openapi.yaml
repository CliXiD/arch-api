  /api/v1/nodes:
    get:
      operationId: list-nodes
      parameters:
      - description: Only nodes of this environment; unknown gives 422.
        explode: false
        in: query
        name: environment
        schema:
          description: Only nodes of this environment; unknown gives 422.
          type: string
      - description: Only nodes of this kind.
        explode: false
        in: query
        name: kind
        schema:
          description: Only nodes of this kind.
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
      - description: Only nodes of this node type.
        explode: false
        in: query
        name: type
        schema:
          description: Only nodes of this node type.
          type: string
      - description: Only nodes owned by this team.
        explode: false
        in: query
        name: owner
        schema:
          description: Only nodes owned by this team.
          type: string
      - description: Case-insensitive substring of the id or name.
        explode: false
        in: query
        name: q
        schema:
          description: Case-insensitive substring of the id or name.
          maxLength: 200
          type: string
      - description: Page size.
        explode: false
        in: query
        name: limit
        schema:
          default: 100
          description: Page size.
          format: int64
          maximum: 500
          minimum: 1
