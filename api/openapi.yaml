components:
  schemas:
    Change:
      additionalProperties: false
      properties:
        action:
          enum:
          - create
          - update
          - delete
          type: string
        actor:
          description: Subject of the token; for a service account, its client id.
          type: string
        actor_kind:
          enum:
          - user
          - service
          type: string
        actor_name:
          description: Username; for a service account, its client id.
          type: string
        after:
          additionalProperties: {}
          description: The entity after the change; null on delete.
          type:
          - object
          - "null"
        at:
          format: date-time
          type: string
        before:
          additionalProperties: {}
          description: The entity before the change; null on create.
          type:
          - object
          - "null"
        entity:
          enum:
          - node
          - edge
          - type
          - team
          - environment
          type: string
        entity_key:
          description: Node <environment>/<id>, edge uid, team or environment id.
          type: string
        id:
          format: int64
          type: integer
        source:
          enum:
          - ui
          - api
          - yaml
          - discovery
          - import
          type: string
      required:
      - id
      - at
      - actor
      - actor_name
      - actor_kind
      - source
      - entity
      - entity_key
      - action
      - before
      - after
      type: object
    Edge:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        environment:
          type: string
        from:
          description: Source node id.
          type: string
        source:
          enum:
          - ui
          - api
          - yaml
          - discovery
          - import
          type: string
        to:
          description: Target node id.
          type: string
        type:
          type: string
        uid:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
      - uid
      - environment
      - type
      - from
      - to
      - attributes
      - source
      - created_at
      - updated_at
      - version
      type: object
    EdgeCreate:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          description: Checked against the type's attributes_schema and for secrets.
          type: object
        environment:
          type: string
        from:
          description: Source node id, in the environment.
          type: string
        to:
          description: Target node id, in the environment.
          type: string
        type:
          description: Edge type id.
          type: string
      required:
      - environment
      - type
      - from
      - to
      type: object
    EdgePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Edge"
          type: array
        next_cursor:
          description: Cursor of the next page; null on the last page.
          type:
          - string
          - "null"
      required:
      - items
      - next_cursor
      type: object
    EdgePatch:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          description: Replaces every attribute.
          type: object
      required:
      - attributes
      type: object
    EdgeType:
      additionalProperties: false
      properties:
        allowed:
          description: Allowed (from kind, to kind) pairs.
          items:
            $ref: "#/components/schemas/KindPair"
          type: array
        attributes_schema:
          additionalProperties: {}
          description: JSON Schema of the edge attributes.
          type: object
        builtin:
          type: boolean
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - attributes_schema
      - allowed
      - builtin
      type: object
    Environment:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        sort:
          format: int64
          type: integer
      required:
      - id
      - name
      - sort
      type: object
    EnvironmentCreate:
      additionalProperties: false
      properties:
        id:
          pattern: ^[a-z0-9][a-z0-9-]{1,62}$
          type: string
        name:
          minLength: 1
          type: string
        sort:
          description: Display order; unique.
          format: int32
          type: integer
      required:
      - id
      - name
      - sort
      type: object
    EnvironmentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Environment"
