openapi: 3.1.0
info:
  title: Architecture E2E API
  version: 0.1.0
paths:
  /api/v1/edges:
    get:
      operationId: list-edges
      parameters:
      - description: Only edges of this environment; unknown gives 422.
        explode: false
        in: query
        name: environment
        schema:
          description: Only edges of this environment; unknown gives 422.
          type: string
      - description: Only edges of this edge type.
        explode: false
        in: query
        name: type
        schema:
          description: Only edges of this edge type.
          type: string
      - description: Only edges from this node id.
        explode: false
        in: query
        name: from
        schema:
          description: Only edges from this node id.
          type: string
      - description: Only edges to this node id.
        explode: false
        in: query
        name: to
        schema:
          description: Only edges to this node id.
          type: string
      - description: Page size.
        explode: false
        in: query
        name: limit
        schema:
          default: 100
          description: Page size.
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - description: Opaque cursor from a previous page's next_cursor.
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque cursor from a previous page's next_cursor.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EdgePage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: A page of edges
      tags:
      - model
  /api/v1/environments:
    get:
      operationId: list-environments
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: Environments
      tags:
      - model
  /api/v1/graph:
    get:
      operationId: get-graph
      parameters:
      - description: The environment; unknown gives 422.
        explode: false
        in: query
        name: environment
        required: true
        schema:
          description: The environment; unknown gives 422.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: One environment's compact graph (gzip when accepted)
      tags:
      - model
  /api/v1/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: The caller's identity, roles and teams
      tags:
      - identity
  /api/v1/nodes:
    get:
      operationId: list-nodes
      parameters:
      - description: Only nodes of this environment; unknown gives 422.
        explode: false
        in: query
        name: environment
        schema:
          description: Only nodes of this environment; unknown gives 422.
          type: string
      - description: Only nodes of this kind.
        explode: false
        in: query
        name: kind
        schema:
          description: Only nodes of this kind.
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
      - description: Only nodes of this node type.
        explode: false
        in: query
        name: type
        schema:
          description: Only nodes of this node type.
          type: string
      - description: Only nodes owned by this team.
        explode: false
        in: query
        name: owner
        schema:
          description: Only nodes owned by this team.
          type: string
      - description: Case-insensitive substring of the id or name.
        explode: false
        in: query
        name: q
        schema:
          description: Case-insensitive substring of the id or name.
          maxLength: 200
          type: string
      - description: Page size.
        explode: false
        in: query
        name: limit
        schema:
          default: 100
          description: Page size.
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - description: Opaque cursor from a previous page's next_cursor.
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque cursor from a previous page's next_cursor.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: A page of nodes
      tags:
      - model
  /api/v1/nodes/{environment}/{id}:
    get:
      operationId: get-node
      parameters:
      - in: path
        name: environment
        required: true
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
          description: OK
          headers:
            ETag:
              schema:
                description: The node's version, quoted.
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: One node
      tags:
      - model
  /api/v1/teams:
    get:
      operationId: list-teams
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: Teams
      tags:
      - model
  /api/v1/types:
    get:
      operationId: list-types
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Types"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: Node and edge types
      tags:
      - model
  /healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness
      tags:
      - health
  /readyz:
    get:
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
          description: Service Unavailable
      summary: "Readiness: database reachable and migrations current"
      tags:
      - health
components:
  schemas:
    Edge:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        environment:
          type: string
        from:
          description: Source node id.
          type: string
        source:
          enum:
          - ui
          - yaml
          - discovery
          - import
          type: string
        to:
          description: Target node id.
          type: string
        type:
          type: string
        uid:
          format: uuid
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
      - uid
      - environment
      - type
      - from
      - to
      - attributes
      - source
      - created_at
      - updated_at
      - version
      type: object
    EdgePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Edge"
          type: array
        next_cursor:
          description: Cursor of the next page; null on the last page.
          type:
          - string
          - "null"
      required:
      - items
      - next_cursor
      type: object
    EdgeType:
      additionalProperties: false
      properties:
        allowed:
          description: Allowed (from kind, to kind) pairs.
          items:
            $ref: "#/components/schemas/KindPair"
          type: array
        attributes_schema:
          additionalProperties: {}
          description: JSON Schema of the edge attributes.
          type: object
        builtin:
          type: boolean
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - attributes_schema
      - allowed
      - builtin
      type: object
    Environment:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        sort:
          format: int64
          type: integer
      required:
      - id
      - name
      - sort
      type: object
    EnvironmentList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Environment"
          type: array
      required:
      - items
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
          - array
          - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Graph:
      additionalProperties: false
      properties:
        edges:
          items:
            $ref: "#/components/schemas/GraphEdge"
          type: array
        environment:
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/GraphNode"
          type: array
      required:
      - environment
      - nodes
      - edges
      type: object
    GraphEdge:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          type: object
        from:
          type: string
        to:
          type: string
        type:
          type: string
        uid:
          format: uuid
          type: string
      required:
      - uid
      - type
      - from
      - to
      - attributes
      type: object
    GraphNode:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
        name:
          type: string
        owner:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          type: string
      required:
      - id
      - kind
      - type
      - name
      - owner
      - tags
      type: object
    KindPair:
      additionalProperties: false
      properties:
        from:
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
        to:
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
      required:
      - from
      - to
      type: object
    Me:
      additionalProperties: false
      properties:
        actor_kind:
          enum:
          - user
          - service
          type: string
        email:
          description: Email, empty when the token has none.
          type: string
        name:
          description: Display name; for a service account, its client id.
          type: string
        roles:
          description: Effective roles, ordered viewer, editor, admin.
          items:
            enum:
            - viewer
            - editor
            - admin
            type: string
          type: array
        subject:
          description: Token sub; for a service account, its client id.
          type: string
        teams:
          description: Teams from the token's teams claim; empty when absent.
          items:
            type: string
          type: array
      required:
      - subject
      - name
      - email
      - roles
      - teams
      - actor_kind
      type: object
    Node:
      additionalProperties: false
      properties:
        attributes:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        description:
          type: string
        environment:
          type: string
        id:
          type: string
        kind:
          description: Fixed by the type.
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
        name:
          type: string
        owner:
          description: Owning team id.
          type: string
        source:
          enum:
          - ui
          - yaml
          - discovery
          - import
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          type: string
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
      - environment
      - id
      - kind
      - type
      - name
      - description
      - owner
      - attributes
      - tags
      - source
      - created_at
      - updated_at
      - version
      type: object
    NodePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Node"
          type: array
        next_cursor:
          description: Cursor of the next page; null on the last page.
          type:
          - string
          - "null"
      required:
      - items
      - next_cursor
      type: object
    NodeType:
      additionalProperties: false
      properties:
        attributes_schema:
          additionalProperties: {}
          description: JSON Schema of the node attributes.
          type: object
        builtin:
          type: boolean
        id:
          type: string
        kind:
          enum:
          - application
          - infrastructure
          - network
          - external
          - team
          type: string
        name:
          type: string
      required:
      - id
      - kind
      - name
      - attributes_schema
      - builtin
      type: object
    ReadinessReport:
      additionalProperties: false
      properties:
        failing:
          description: Failing checks, only when unavailable.
          items:
            enum:
            - database
            - migrations
            type: string
          type: array
        status:
          enum:
          - ok
          - unavailable
          examples:
          - ok
          type: string
      required:
      - status
      type: object
    Status:
      additionalProperties: false
      properties:
        status:
          enum:
          - ok
          examples:
          - ok
          type: string
      required:
      - status
      type: object
    Team:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      - created_at
      type: object
    TeamList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Team"
          type: array
      required:
      - items
      type: object
    Types:
      additionalProperties: false
      properties:
        edge_types:
          items:
            $ref: "#/components/schemas/EdgeType"
          type: array
        node_types:
          items:
            $ref: "#/components/schemas/NodeType"
          type: array
      required:
      - node_types
      - edge_types
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
