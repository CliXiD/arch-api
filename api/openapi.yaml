          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: One environment's compact graph (gzip when accepted)
      tags:
      - model
  /api/v1/history:
    get:
      operationId: get-history
      parameters:
      - description: The entity whose history is read; only node in this version.
        explode: false
        in: query
        name: entity
        required: true
        schema:
          description: The entity whose history is read; only node in this version.
          enum:
          - node
          type: string
      - description: The node's environment.
        explode: false
        in: query
        name: environment
        required: true
        schema:
          description: The node's environment.
          type: string
      - description: The node's id.
        explode: false
        in: query
        name: id
        required: true
        schema:
          description: The node's id.
          type: string
      - description: Page size.
        explode: false
        in: query
        name: limit
        schema:
          default: 50
          description: Page size.
          format: int64
          maximum: 500
          minimum: 1
          type: integer
      - description: Opaque cursor from a previous page's next_cursor.
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque cursor from a previous page's next_cursor.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Request Entity Too Large
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
      - bearer: []
      summary: A node's change_log rows and its edges' rows, newest first
