openapi: 3.1.0
info:
  title: Architecture E2E API
  version: 0.1.0
paths:
  /api/v1/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
      - bearer: []
      summary: The caller's identity, roles and teams
      tags:
      - identity
  /healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness
      tags:
      - health
  /readyz:
    get:
      operationId: get-readyz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
          description: Service Unavailable
      summary: "Readiness: database reachable and migrations current"
      tags:
      - health
components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
          - array
          - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Me:
      additionalProperties: false
      properties:
        actor_kind:
          enum:
          - user
          - service
          type: string
        email:
          description: Email, empty when the token has none.
          type: string
        name:
          description: Display name; for a service account, its client id.
          type: string
        roles:
          description: Effective roles, ordered viewer, editor, admin.
          items:
            enum:
            - viewer
            - editor
            - admin
            type: string
          type: array
        subject:
          description: Token sub; for a service account, its client id.
          type: string
        teams:
          description: Teams from the token's teams claim; empty when absent.
          items:
            type: string
          type: array
      required:
      - subject
      - name
      - email
      - roles
      - teams
      - actor_kind
      type: object
    ReadinessReport:
      additionalProperties: false
      properties:
        failing:
          description: Failing checks, only when unavailable.
          items:
            enum:
            - database
            - migrations
            type: string
          type: array
        status:
          enum:
          - ok
          - unavailable
          examples:
          - ok
          type: string
      required:
      - status
      type: object
    Status:
      additionalProperties: false
      properties:
        status:
          enum:
          - ok
          examples:
          - ok
          type: string
      required:
      - status
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
