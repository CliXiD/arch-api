version: "2"
sql:
  - engine: postgresql
    schema: migrations/
    queries: internal/db/queries/
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
